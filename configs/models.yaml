# LALMs under evaluation (E04-E09).
# Model identifiers and checkpoint revisions are verified and pinned in E04/E08/E09.
#
# compute:
#   local    - runs on the laptop (API calls, light CPU work)
#   hf_jobs  - runs on Hugging Face Jobs (GPU / heavy CPU work)

models:
  gpt_audio_1_5:
    display_name: GPT-Audio-1.5
    provider: openai
    access: api
    model_id: gpt-audio-1.5
    api_key_env: OPENAI_API_KEY
    compute: local
    output: outputs/captions/gpt_audio_1_5_captions.jsonl

  gemini_3_8_flash:
    display_name: Gemini 3.8 Flash
    provider: google
    access: api
    model_id: gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    compute: local
    output: outputs/captions/gemini_3_8_flash_captions.jsonl

  qwen3_omni:
    display_name: Qwen3-Omni
    provider: huggingface
    access: open_weights
    model_id: Qwen/Qwen3-Omni-30B-A3B-Instruct
    revision: null  # pinned to a commit hash in E08
    compute: hf_jobs
    hf_jobs:
      flavor: null  # GPU flavor chosen in E05 pilot
    output: outputs/captions/qwen3_omni_captions.jsonl

  audio_flamingo_3:
    display_name: Audio Flamingo 3
    provider: huggingface
    access: open_weights
    model_id: nvidia/audio-flamingo-3-hf
    revision: null  # pinned to a commit hash in E09
    compute: hf_jobs
    hf_jobs:
      flavor: null  # GPU flavor chosen in E05 pilot
    output: outputs/captions/audio_flamingo_3_captions.jsonl
