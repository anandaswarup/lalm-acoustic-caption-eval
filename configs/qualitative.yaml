# Qualitative review (E17-E20, RQ3). E17 draws a simple random sample of evaluation recordings, independent of model
# scores (proposal 5.4), and writes blinded review sheets: each recording gets its own random order of the four models
# (labels A-D) and the recordings are presented in random order. Reviewers see the five references and each caption as
# scored, never file names, model names or metric scores. The blinding key stays out of git until the E18 labels are final;
# its SHA-256 is recorded in the sample manifest.
sample:
  num_recordings: 50
  seed: 42
reviewers: 1  # one reviewer (decided 2026-11-05); more reviewers are left for future work
output_dir: outputs/qualitative

# Primary agreement category per generated caption (E18). Reviewers compare the caption with the references only,
# without the audio.
categories:
  - code: 1
    name: Strong agreement
    description: Closely matches the principal sound sources, events and characteristics in the references.
  - code: 2
    name: Mostly aligned
    description: Agrees with the main content of the references, with minor differences in wording or emphasis.
  - code: 3
    name: Mostly aligned with additional details
    description: The main description agrees, but the caption adds acoustic details absent from the references.
  - code: 4
    name: Partially aligned with missing details
    description: Captures some referenced content but omits important sound sources, events or characteristics.
  - code: 5
    name: Partially aligned with additional details
    description: Captures some referenced content but introduces sources, events or descriptions not in the references.
  - code: 6
    name: Weak agreement or sound-source/event mismatch
    description: Differs substantially from the references or appears to describe a different source or event.

# Annotation analysis (E18): category shares per model with Wilson intervals, and the mean five-reference item score
# (E12) of each category, pooled over models (descriptive).
annotation:
  confidence: 0.95
  score_metrics: [cider_d, spice, fense, bertscore_f1_rescaled, clap_similarity, mace]

# Audio-grounded review (E19): after the E18 labels are final, the reviewer listens to each recording and rates every
# caption against the audio, and checks each E18 disputed phrase. References, E18 categories, model names, file names
# and scores are not shown. Category 6 is not asked directly: a category-6 caption rated 3 is a real mismatch, one
# rated 1 or 2 means the references are incomplete.
audio_review:
  ratings:
    - code: 1
      name: Accurate
      description: Every sound source and event in the caption is audible, and the described attributes and order match the recording. Omitting secondary sounds is acceptable.
    - code: 2
      name: Minor errors
      description: The principal sound source and event are correct, but the caption has a wrong attribute or order, an unsupported secondary detail, or omits a secondary sound.
    - code: 3
      name: Major error or wrong sound source
      description: The principal sound source or event is wrong, a principal source is invented, or the dominant sound is omitted.
  verdicts:
    - code: S
      name: Supported
      description: The recording contains what the phrase describes.
    - code: U
      name: Unsupported
      description: The recording does not contain what the phrase describes, or contradicts it.
    - code: A
      name: Ambiguous or unverifiable
      description: Listening can neither confirm nor rule it out (masked, too faint, or not decidable from sound alone).
  confidence: 0.95
  score_metrics: [cider_d, spice, fense, bertscore_f1_rescaled, clap_similarity, mace]

# Representative caption comparisons (E20): one recording per pattern, chosen by the rules in src/analysis/examples.py
# (deterministic; ties broken by a shuffle seeded with `seed`), plus every sampled recording as a supplementary table.
# Figures: E18 categories and E19 ratings per model, and the E18 x E19 heatmap.
examples:
  seed: 42
  tables_dir: outputs/tables
  figures_dir: outputs/figures
  figure_formats: [pdf, png]
  dpi: 300
  short_categories:  # figure legends, in code order
    - Strong agreement
    - Mostly aligned
    - Aligned + extra detail
    - Partial, missing detail
    - Partial + extra detail
    - Weak or mismatch
  short_ratings: [Accurate, Minor errors, Major error]
