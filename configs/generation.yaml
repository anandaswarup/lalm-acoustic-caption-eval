# Caption-generation settings (E04-E09). Frozen at the end of the E05 pilot.
frozen: false

# Which manifest to caption; override with --run or --set run=pilot.
run: evaluation
runs:
  evaluation:
    manifest: data/manifests/clotho_eval_manifest.jsonl
    output_dir: outputs/captions/evaluation
  pilot:
    manifest: data/manifests/clotho_pilot_manifest.jsonl
    output_dir: outputs/captions/pilot

# E05 pilot history (GPT-Audio-1.5 returned JSON objects instead of a sentence):
#   v1  JSON in 17/20 captions, often with the prompt's three items as keys
#   v2  v1 plus the plain-text sentence: JSON in 10/20
#   v3  the three items become a clause of the first sentence; every adapter sends the audio before the text.
#       Frozen. 2/20 GPT captions were still a plain sentence wrapped as {"..."}; E10 normalization unwraps
#       exactly that form (raw text kept) and flags any other JSON-like output.
prompt:
  version: v3
  text: >-
    Describe the sounds heard in this audio recording in one clear sentence
    that mentions the main sound sources, audible events, and distinguishing
    acoustic characteristics. Do not speculate about sources or events that are
    not supported by the audio. Respond with the sentence only, as plain text,
    without JSON, lists, labels or other formatting.

# Shared by all models. Deterministic decoding where the provider supports it;
# max_output_tokens is a ceiling, not a length target (for Gemini it includes
# thinking tokens). Per-model additions are in models.yaml (decoding_overrides)
# and any deviation is recorded per request rather than assumed equivalent.
decoding:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 2048

# Audio is never cropped or temporally modified; any resampling or channel
# conversion required by a provider is recorded per request.
audio:
  allow_resample: true
  allow_crop: false

# concurrency: requests in flight at once (1 = sequential); API models raise it in models.yaml
# requests_overrides. Requests are independent, so it changes run time only, never the captions.
# format_attempts: an ok caption that is JSON-like (starts with { or [) instead of a sentence is requested again,
# up to this many requests in total, for every model; rejected responses are kept in the record (format_rejected).
# Added in E05: GPT-Audio-1.5 output varies at temperature 0 and returned a multi-field JSON object for ~1 in 20
# pilot recordings even with prompt v3. A plain sentence wrapped as {"..."} after the last attempt is handled by
# the E10 normalization.
requests:
  concurrency: 1
  format_attempts: 3
  timeout_seconds: 120
  max_retries: 5
  backoff_seconds: 2.0

resume: true
